name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: '.python-version が無い場合に使う Python のバージョン'
        type: string
        default: '3.13'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # プロジェクトが .python-version で版を固定していればそれに従う。
      # 呼び出し側の入力は、ファイルを置いていないリポジトリ向けの既定値として残す
      - name: Install Python
        run: |
          if [ -f .python-version ]; then
            uv python install
          else
            uv python install ${{ inputs.python-version }}
          fi

      - name: Install dependencies
        run: uv sync --dev

      # 設定変更で既存ファイルが違反になった場合も検出するため、全ファイルへ掛ける
      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Run pyright
        run: uv run pyright

      - name: Run tests
        run: |
          if [ -d tests ]; then
            uv run pytest
          fi
