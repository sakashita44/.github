name: Reusable Node CI

on:
  workflow_call:
    inputs:
      node-version:
        description: '.nvmrc が無い場合に使う Node.js のバージョン'
        type: string
        default: '24'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # プロジェクトが .nvmrc で版を固定していればそれに従う。
      # 呼び出し側の入力は、ファイルを置いていないリポジトリ向けの既定値として残す
      - name: Resolve Node.js version
        id: node-version
        run: |
          if [ -f .nvmrc ]; then
            echo "value=$(tr -d ' \n\r' < .nvmrc)" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.node-version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node-version.outputs.value }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Check format
        run: npm run --if-present format:check

      - name: Run typecheck
        run: npm run --if-present typecheck

      - name: Run test
        run: npm run test

      - name: Run build
        run: npm run build --if-present
