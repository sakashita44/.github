name: Reusable Node CI

on:
  workflow_call:
    inputs:
      node-version:
        description: '使用する Node.js のバージョン'
        type: string
        default: '24'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Check format
        run: npm run --if-present format:check

      - name: Run typecheck
        run: npm run --if-present typecheck

      - name: Run test
        run: npm run test

      - name: Run build
        run: npm run build --if-present
